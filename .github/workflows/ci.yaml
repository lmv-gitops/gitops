name: Terraform plan

on:
  pull_request:
    paths:
      - "tf/**"
      - ".github/workflows/ci.yaml"

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    env:
      TF_VAR_utxgo_repository_administration_app_id: ${{ secrets.UTXGO_REPOSITORY_ADMINISTRATION_APP_ID }}
      TF_VAR_utxgo_repository_administration_client_id: ${{ secrets.UTXGO_REPOSITORY_ADMINISTRATION_CLIENT_ID }}
      TF_VAR_utxgo_repository_administration_private_key: ${{ secrets.UTXGO_REPOSITORY_ADMINISTRATION_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: tf

      - name: Terraform Plan
        run: terraform plan -input=false -out=plan-${{ github.event.pull_request.number }}.tfplan
        working-directory: tf

      - name: List files in tf directory (debug)
        run: ls -alh tf

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.event.pull_request.number }}
          path: tf/plan-${{ github.event.pull_request.number }}.tfplan

      - name: Comment with Terraform Plan
        uses: peter-evans/create-or-update-comment@v2
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### Terraform Plan Output
            ```txt
            $(terraform show -no-color tf/plan-${{ github.event.pull_request.number }}.tfplan)
            ```
